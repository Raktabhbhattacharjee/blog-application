<article class="group flex h-full flex-col border border-line bg-paper transition duration-300 hover:-translate-y-1 hover:border-brand-200 hover:bg-white">
  <a href="{% url 'post_detail' post.slug %}" class="relative block aspect-[16/10] overflow-hidden bg-stone-200" aria-label="Read {{ post.title }}">
    {% if post.feature_image %}<img src="{{ post.feature_image.url }}" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" alt="{{ post.title }}" loading="lazy">{% else %}<div class="grid h-full place-items-center font-mono text-xs uppercase tracking-widest text-muted">DevChronicle</div>{% endif %}
  </a>
  <div class="flex flex-1 flex-col p-5 sm:p-6">
    <div class="flex items-center justify-between gap-3"><span class="pill pill-brand">{{ post.category.category_name }}</span><time class="font-mono text-[0.65rem] uppercase tracking-wider text-muted" datetime="{{ post.created_at|date:'Y-m-d' }}">{{ post.created_at|date:"M d, Y" }}</time></div>
    <h3 class="mt-5 text-2xl font-bold leading-tight group-hover:text-brand-600"><a href="{% url 'post_detail' post.slug %}">{{ post.title }}</a></h3>
    <p class="mt-3 line-clamp-3 leading-7 text-muted">{{ post.short_description }}</p>
    <div class="mt-auto flex items-center justify-between border-t border-line pt-5 mt-6"><span class="text-sm text-muted">By <strong class="font-semibold text-ink">{{ post.author.username|default:"Author" }}</strong></span><span class="font-mono text-xs font-bold uppercase tracking-wider text-brand-600">Read →</span></div>
  </div>
</article>
