<form action="{% url 'search' %}" method="GET" role="search" class="flex items-center gap-1.5 w-full">
  <div class="relative flex-1">
    <label for="{{ field_id }}" class="sr-only">Search articles</label>

    <svg class="pointer-events-none absolute top-1/2 left-3 h-4 w-4 -translate-y-1/2 text-slate-400"
         viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" clip-rule="evenodd"
            d="M9 3.5a5.5 5.5 0 1 0 3.437 9.8l3.632 3.63a.75.75 0 1 0 1.06-1.06l-3.631-3.632A5.5 5.5 0 0 0 9 3.5ZM5 9a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z" />
    </svg>

    <input id="{{ field_id }}"
           type="search"
           name="keyword"
           value="{{ keyword|default:'' }}"
           placeholder="Search articles…"
           autocomplete="off"
           class="w-full rounded-full border border-line bg-paper py-2 pr-3 pl-9 text-xs text-ink placeholder:text-muted transition duration-150 focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:outline-none sm:text-sm">
  </div>

  <button type="submit" class="btn btn-primary shrink-0 py-2 px-3 text-xs sm:text-sm rounded-xl">
    <span>Search</span>
  </button>
</form>
