{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="text-center bg-white rounded-4 shadow-sm py-5 px-4">
      <p class="display-1 fw-bold text-danger mb-0">404</p>
      <h1 class="h3 fw-semibold mb-3">Oops! Page not found</h1>
      <p class="text-muted lead mb-4">
        The category, article, or page you are looking for doesn't exist or has been moved.
      </p>
      <a href="{% url 'home' %}" class="btn btn-primary px-4">&larr; Back to home</a>
    </div>
  </div>
</div>
{% endblock %}
