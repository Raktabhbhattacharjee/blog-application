{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
  <div class="rounded-2xl border border-slate-200 bg-white px-6 py-16 text-center shadow-sm">
    <p class="text-6xl font-bold tracking-tight text-brand-600 sm:text-7xl">404</p>
    <h1 class="mt-4 text-2xl">Oops! Page not found</h1>
    <p class="mx-auto mt-3 max-w-sm leading-relaxed text-slate-500">
      The category, article, or page you are looking for doesn't exist or has been moved.
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary mt-8">
      <span aria-hidden="true">&larr;</span> Back to home
    </a>
  </div>
</div>
{% endblock %}
