{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5 bg-white rounded shadow-sm my-4">
    <h1 class="display-1 fw-bold text-danger mb-0">404</h1>
    <h3 class="fw-semibold text-dark mb-3">Oops! Page Not Found</h3>
    <p class="text-muted mb-4 lead px-3">
        The category, article, or page you are looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="btn btn-primary px-4 py-2">
        &larr; Back to Home
    </a>
</div>
{% endblock %}
