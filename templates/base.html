<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Blog{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- GLOBAL NAVBAR inside base.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center">
        
        <div class="d-flex align-items-center">
            <a class="navbar-brand fw-bold me-4" href="/">Django Blog</a>
            
            <!-- DYNAMIC CATEGORIES INJECTED GLOBALLY -->
            <div class="navbar-nav flex-row gap-3">
                {% for category in categories %}
                    <a class="nav-link" href="{% url 'post_by_category' category.id %}">
                        {{ category.category_name }}
                    </a>
                {% endfor %}
            </div>
        </div>

        <!-- AUTH BUTTONS -->
        <div class="d-flex gap-2">
            <a href="#" class="btn btn-outline-light btn-sm">Login</a>
            <a href="#" class="btn btn-primary btn-sm">Register</a>
        </div>

    </div>
</nav>

    <!-- INJECTION ZONE FOR CHILD TEMPLATES -->
    <main class="container py-4 flex-grow-1">
        {% block content %}
        <!-- Child templates dump their HTML inside this block -->
        {% endblock %}
    </main>

    <!-- GLOBAL FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>&copy; 2026 Django Blog Project</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
