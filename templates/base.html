{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Blog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="blog-header py-3 mb-3 border-bottom">
            <div class="row flex-nowrap justify-content-between align-items-center">
                <div class="col-8">
                    <a class="blog-header-logo text-dark h3 text-decoration-none" href="#">Django Blog</a>
                </div>
                <div class="col-4 d-flex justify-content-end align-items-center">
                    <a class="btn btn-sm btn-outline-primary mr-2" href="#">Login</a>
                    <a class="btn btn-sm btn-primary" href="#">Register</a>
                </div>
            </div>
        </header>

        <!-- Main Content Block -->
        <main role="main">
            {% block content %}
            <!-- Child templates inject page content here -->
            {% endblock %}
        </main>
    </div>

    <!-- Footer -->
    <footer class="blog-footer text-center py-4 mt-5 border-top text-muted">
        <p>Django Blog &copy; 2026</p>
    </footer>
</body>
</html>
